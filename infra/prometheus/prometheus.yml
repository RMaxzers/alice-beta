global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: alice
    static_configs: [{ targets: ["127.0.0.1:9101"] }]
  - job_name: windows
    static_configs: [{ targets: ["127.0.0.1:9182"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]
  - job_name: qdrant
    metrics_path: /metrics
    static_configs: [{ targets: ["127.0.0.1:6333"] }]
  - job_name: grafana
    static_configs: [{ targets: ["127.0.0.1:3000"] }]
