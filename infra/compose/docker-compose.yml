# Alice phase 2: Qdrant, Prometheus and Grafana as containers on Docker Engine inside WSL2 (Ubuntu-24.04).
# Run from WSL:  docker compose -p alice -f /mnt/c/Users/cuent/alice/infra/compose/docker-compose.yml --env-file <vars> up -d
#
# Networking: WSL "mirrored" mode + network_mode: host, and every service binds 127.0.0.1 itself.
#  - Ports stay exactly as in the native runtime (6333/9090/3000), so Alice's config does not change.
#  - Prometheus can scrape windows_exporter (127.0.0.1:9182) and Alice (127.0.0.1:9101) on the Windows host.
#  - Nothing listens on LAN/tailnet interfaces (verified by Migrate-ToDocker.ps1 after start).
# Deviation from "internal Compose networks" in the spec is documented in docs/DECISIONS.md (D18).
# Images pinned by digest (same versions as the native runtime).

name: alice

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    container_name: alice-qdrant
    network_mode: host
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HOST: 127.0.0.1
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: alice-prometheus
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: alice-grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: ${ALICE_GRAFANA_PUBLIC_URL:-http://127.0.0.1:3000/}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      ALICE_GRAFANA_DASHBOARDS: /var/lib/grafana/alice-dashboards
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/alice-dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  qdrant-data:
  qdrant-snapshots:
  prometheus-data:
  grafana-data:
